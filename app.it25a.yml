# yaml-language-server: $schema=https://raw.githubusercontent.com/IT25A/deploy-workflows/main/schema/it25a.schema.json
version: 1
compose: compose.it25a.yml
services:
  app:
    build: .
    port: 3000
    route: { host: "@" }
    environment:
      ORIGIN: "{{ url.app }}"
      OIDC_ISSUER: https://id.it25a.de
      OIDC_CLIENT_ID: 9d11ba44
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"   # must be a string, not a number
      POSTGRES_DB: x_poll_db
      POSTGRES_USER: x_poll_user
    secrets:
      - OIDC_CLIENT_SECRET
      - AUTH_SECRET
      - POSTGRES_PASSWORD