name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: it25a-deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write       # push images to ghcr.io
  id-token: write       # authenticate to the deployer without a stored password
  deployments: write    # mark preview deployments as inactive when the pull request is closed

jobs:
  deploy:
    uses: IT25A/deploy-workflows/.github/workflows/deploy.yml@v1
    secrets: inherit    # the workflow passes on only the secrets declared in app.it25a.yml