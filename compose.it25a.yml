services:
  app:
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: x_poll_db
      POSTGRES_USER: x_poll_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: {}